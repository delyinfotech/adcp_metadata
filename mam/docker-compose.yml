version: '3.8'

services:
  # Frontend - Next.js Web Application
  mediax-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: mediax-web
    ports:
      - '3004:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NEXT_PUBLIC_WS_URL=http://localhost:4000
      - NEXT_PUBLIC_APP_NAME=GEN21 MediaX AI
      - NEXT_PUBLIC_ENABLE_AI_FEATURES=true
    depends_on:
      - mediax-api
    networks:
      - adcp-network
    restart: unless-stopped

  # Backend - NestJS API
  mediax-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: mediax-api
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      # Application
      - NODE_ENV=development
      - PORT=4000
      - API_PREFIX=api/v1

      # Database
      - DATABASE_HOST=mediax-postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=mediax
      - DATABASE_PASSWORD=mediax_password
      - DATABASE_NAME=mediax
      - DATABASE_SYNCHRONIZE=true
      - DATABASE_LOGGING=true
      - DATABASE_SSL=false

      # JWT
      - JWT_SECRET=mediax-super-secret-jwt-key-change-in-production
      - JWT_EXPIRATION=1d
      - JWT_REFRESH_SECRET=mediax-refresh-secret-key-change-in-production
      - JWT_REFRESH_EXPIRATION=7d

      # Redis
      - REDIS_HOST=mediax-redis
      - REDIS_PORT=6379

      # MinIO
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_ORIGINALS=content-originals
      - MINIO_BUCKET_PROCESSED=content-processed
      - MINIO_BUCKET_ARTIFACTS=extraction-artifacts
      - MINIO_USE_SSL=false

      # CDN
      - CDN_BASE_URL=http://localhost:9000

      # Kafka
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=adcp-kafka:9092
      - KAFKA_CLIENT_ID=mediax-ai
      - KAFKA_GROUP_ID=mediax-consumers

      # Metadata Extraction Layer
      - METADATA_API_URL=http://metadata-layer:3005

      # CORS
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3004
      - CORS_CREDENTIALS=true
    depends_on:
      mediax-postgres:
        condition: service_healthy
      mediax-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - adcp-network
    restart: unless-stopped

  # PostgreSQL Database for MAM with pgvector for AI embeddings
  mediax-postgres:
    image: pgvector/pgvector:pg16
    container_name: mediax-postgres
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_DB=mediax
      - POSTGRES_USER=mediax
      - POSTGRES_PASSWORD=mediax_password
    volumes:
      - mediax_postgres_data:/var/lib/postgresql/data
      - ./backend/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    networks:
      - adcp-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mediax']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for MAM (separate from metadata extraction)
  mediax-redis:
    image: redis:7-alpine
    container_name: mediax-redis
    ports:
      - '6381:6379'
    volumes:
      - mediax_redis_data:/data
    networks:
      - adcp-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO (shared with metadata extraction)
  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    container_name: mam-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_NOTIFY_KAFKA_ENABLE_PRIMARY=on
      - MINIO_NOTIFY_KAFKA_BROKERS_PRIMARY=adcp-kafka:9092
      - MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY=minio.events
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - adcp-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # MinIO Initialization - Create buckets
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      sleep 5;

      echo 'Configuring MinIO client...';
      mc alias set adcp http://minio:9000 minioadmin minioadmin;

      echo 'Creating buckets...';
      mc mb adcp/content-originals --ignore-existing;
      mc mb adcp/content-processed --ignore-existing;
      mc mb adcp/extraction-artifacts --ignore-existing;
      mc mb adcp/strapi-uploads --ignore-existing;

      echo 'Setting bucket versioning...';
      mc version enable adcp/content-originals;

      echo 'Configuring event notifications...';
      mc event add adcp/content-originals arn:minio:sqs::PRIMARY:kafka \
        --event put,delete \
        --suffix .mp4,.mov,.avi,.mkv,.jpg,.jpeg,.png,.webp;

      echo 'MinIO initialization complete!';
      "
    networks:
      - adcp-network

networks:
  adcp-network:
    name: adcp-network
    driver: bridge

volumes:
  mediax_postgres_data:
    driver: local
  mediax_redis_data:
    driver: local
  minio_data:
    driver: local
